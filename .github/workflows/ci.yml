# Intégration continue — la même vérification que celle faite à la main avant
# chaque déploiement, mais à CHAQUE push : tests contre une vraie base
# Postgres, build de production, audit des dépendances de production.
#
# Un push sur main déclenche aussi le déploiement Vercel : cette CI ne le
# bloque pas (Vercel ne l'attend pas), mais elle laisse une trace rouge sur le
# commit — et un test rouge se voit avant qu'un membre ne le voie.
name: CI

on:
  push:
  pull_request:

jobs:
  verifier:
    name: tests · build · audit
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: genigain_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/genigain_ci?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/genigain_ci?schema=public
      AUTH_SECRET: ci-secret-sans-valeur-hors-de-cette-machine
      AUTH_TRUST_HOST: "true"
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      # Aucune clé de service : aucun email, aucun appel réseau tiers depuis la CI.
      RESEND_API_KEY: ""
      STRIPE_SECRET_KEY: ""
      ANTHROPIC_API_KEY: ""
      MICROSOFT_TRANSLATOR_KEY: ""

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` lance `prisma generate` (postinstall) : le client est prêt.
      - run: npm ci

      - name: Migrations sur la base de la CI
        run: npx prisma migrate deploy

      - name: Tests (contre la base Postgres du job)
        run: npm test

      - name: Build de production
        run: npm run build

      # Deux audits, deux rôles. Le premier BLOQUE : une vulnérabilité critique
      # (comme celles d'Auth.js fermées le 2 septembre) ne doit jamais passer.
      # Le second INFORME sans bloquer : au niveau « high », la chaîne de la CLI
      # Prisma (deepmerge-ts, mysql2 — jamais exécutés en production) et, tant
      # que Next 16 n'est pas déployé, postcss (outil de build) le rendraient
      # rouge en permanence — et une CI toujours rouge n'est plus lue.
      - name: Audit bloquant (critique)
        run: npm audit --audit-level=critical

      - name: Audit informatif (high, ne bloque pas)
        continue-on-error: true
        run: npm audit --audit-level=high
